name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add repository secrets KEYSTORE_BASE64 (base64 of dslsk-release.jks)
      # and KEYSTORE_PASSWORD so CI builds can update the app already on your phone.
      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/dslsk-release.jks
          printf 'storeFile=keystore/dslsk-release.jks\nstorePassword=%s\nkeyAlias=dslsk\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Unit tests and release APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: DSLsk-apk
          path: app/build/outputs/apk/release/*.apk
